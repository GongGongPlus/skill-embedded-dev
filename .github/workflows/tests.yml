name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install optional serial dependency
        run: python -m pip install --disable-pip-version-check pyserial ruff

      - name: Lint (ruff)
        run: python -m ruff check scripts tests

      - name: Unit and repository-lint tests
        run: python -m unittest discover -s tests -v

      - name: Compile check
        run: python -m compileall -q scripts tests

      - name: CLI help
        run: python scripts/embedded_dev.py --help

      - name: Environment report (JSON contract)
        run: python scripts/embedded_dev.py env --json

      - name: Dry-run build and flash (no hardware)
        shell: bash
        run: |
          python scripts/embedded_dev.py build --project examples/stm32-openocd --backend cmake --dry-run
          python scripts/embedded_dev.py flash --image build/firmware.elf --backend openocd \
            --openocd-interface interface/cmsis-dap.cfg --openocd-target target/stm32f1x.cfg --dry-run

      - name: Protocol decode examples
        shell: bash
        run: |
          python scripts/embedded_dev.py decode validate --spec examples/protocols/uart-env-sensor.json
          python scripts/embedded_dev.py decode uart --spec examples/protocols/uart-env-sensor.json \
            --file examples/protocols/capture-uart.hex --json
          python scripts/embedded_dev.py decode can --log examples/protocols/candump.log --json

      - name: MCP server self-test
        run: python scripts/mcp_server.py --self-test

      - name: Control-loop, board and project-memory examples
        shell: bash
        run: |
          python scripts/embedded_dev.py tune analyze --csv examples/control/response.csv --json
          python scripts/embedded_dev.py tune check-update --file examples/control/proposal.json --json
          python scripts/embedded_dev.py tune simulate --config examples/control/thermal-demo.json \
            --out build/thermal.csv --json
          python scripts/embedded_dev.py board controller --netlist examples/board/demo.kicadxml --json
          python scripts/embedded_dev.py board from-ioc --file examples/board/demo.ioc --json
          python scripts/embedded_dev.py memory detect --project examples/board --json

      - name: HIL dry-run plan (no hardware)
        run: |
          python scripts/embedded_dev.py hil --project examples/stm32-openocd --image build/firmware.elf \
            --build-backend cmake --flash-backend openocd --openocd-interface interface/cmsis-dap.cfg \
            --openocd-target target/stm32f1x.cfg --dry-run

      - name: Refuse to guess a backend
        shell: bash
        run: |
          set +e
          python scripts/embedded_dev.py flash --image fw.bin --backend esptool --dry-run
          code=$?
          set -e
          test "$code" -eq 6 || { echo "expected EXIT_CONFIG(6), got $code"; exit 1; }

      - name: Report contract smoke test
        run: python scripts/embedded_dev.py report --emit-example --json

      - name: Installer dry-run and host detection
        run: |
          python scripts/install.py --list --json
          python scripts/install.py --target project --dry-run --json

      - name: Stack report and symbol resolution contracts
        shell: bash
        run: |
          set -e
          printf 'Task State Prio Stack Num\nmain B 2 64 4\nsensor B 3 900 5\n' > "$RUNNER_TEMP/tasklist.txt"
          set +e
          python scripts/embedded_dev.py stack --tasklist "$RUNNER_TEMP/tasklist.txt" --min-free 128 --json
          code=$?
          set -e
          test "$code" -eq 3 || { echo "expected EXIT_FAULT(3) for a low watermark, got $code"; exit 1; }
          set +e
          python scripts/embedded_dev.py symbolize --addr 0x08000100
          code=$?
          set -e
          test "$code" -eq 6 || { echo "expected EXIT_CONFIG(6) without --elf, got $code"; exit 1; }

      - name: Install two host copies and verify both
        shell: bash
        run: |
          set -e
          tmp=$(mktemp -d)
          python scripts/install.py --dest "$tmp/dsh-copy" --json
          python scripts/install.py --dest "$tmp/codex-copy" --json
          python scripts/install.py --dest "$tmp/dsh-copy" --verify-only
          python scripts/install.py --dest "$tmp/codex-copy" --verify-only

  docs:
    name: docs link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Markdown relative links resolve
        run: python -m unittest tests.test_repo_lint.TestMarkdownLinks -v
