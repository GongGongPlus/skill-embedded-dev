# OpenOCD configuration for the STM32F103 example.
# Usage:
#   openocd -f openocd.cfg -c "program build/firmware.elf verify reset exit"
# Or let scripts/embedded_dev.py construct the same command:
#   python scripts/embedded_dev.py flash --image build/firmware.elf --backend openocd \
#     --openocd-interface interface/cmsis-dap.cfg --openocd-target target/stm32f1x.cfg
#
# For a ST-Link instead, change the interface file to interface/stlink.cfg.
source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 1000
source [find target/stm32f1x.cfg]
