[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]
ignore = [
    # datetime.UTC is Python 3.11+; the CI matrix still covers 3.10.
    "UP017",
    # B905: these call sites intentionally zip differently sized sequences.
    "B905",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
